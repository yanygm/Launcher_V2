name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Publish_win-x64
      run: dotnet publish Launcher.csproj --runtime win-x64 -p:PublishSingleFile=true -p:AssemblyName=Launcher -o PublishedWinExe -c Release --no-self-contained

    - name: Get current date
      id: date
      run: echo "date=$(date +%y%m%d)" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Releases
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.date.outputs.date }}
        name: Launcher
        artifacts: "PublishedWinExe/Launcher.exe"
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
